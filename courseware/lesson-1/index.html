<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>第一课：网页是怎么工作的</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; color: #1f2937; background: #f8fafc; line-height: 1.8; }
    .wrap { max-width: 760px; margin: 0 auto; padding: 48px 24px; }
    h1 { font-size: 28px; margin-bottom: 8px; }
    .sub { color: #6b7280; margin-bottom: 32px; }
    .step { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 20px 24px; margin-bottom: 16px; }
    .step b { color: #2563eb; }
    code { background: #eef2ff; padding: 2px 6px; border-radius: 6px; font-size: 14px; }
    a.back { display: inline-block; margin-top: 24px; color: #2563eb; text-decoration: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>第一课：网页是怎么工作的</h1>
    <p class="sub">用一个最简单的比喻，理解你每次打开网页时发生了什么。</p>

    <div class="step"><b>1. 你在浏览器输入网址</b><br />浏览器把这个请求发给服务器，就像在图书馆报出一个书名。</div>
    <div class="step"><b>2. 服务器返回 HTML</b><br />HTML 是网页的"骨架"，告诉浏览器页面上有哪些内容、怎么排布。</div>
    <div class="step"><b>3. CSS 负责"化妆"</b><br /><code>style</code> 让文字有颜色、有间距、有布局，页面才好看。</div>
    <div class="step"><b>4. Cloudflare 帮你加速</b><br />把网页缓存到全球节点，不管用户在哪，打开都很快。</div>

    <a class="back" href="../">← 返回课件中心</a>
  </div>
</body>
</html>
